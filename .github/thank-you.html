<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Thank You | ShorePointIT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="/favicon.png" />

  <style>
    :root {
      --navy: #0f1f3d;
      --electric-blue: #2563eb;
      --text-main: #ffffff;
      --text-muted: #d1d5db;
      --border-light: #334155;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: var(--navy);
      color: var(--text-main);
      line-height: 1.6;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 1rem;
    }

    h1 span {
      color: var(--electric-blue);
    }

    p {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .box {
      background-color: #11254d;
      border: 2px solid var(--electric-blue);
      border-radius: 20px;
      padding: 2rem;
      margin-top: 2rem;
    }

    .phone {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--electric-blue);
      margin-top: 0.5rem;
    }

    a.call-btn {
      display: inline-block;
      margin-top: 1rem;
      background-color: var(--electric-blue);
      color: #ffffff;
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
    }

    footer {
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-light);
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    footer span {
      color: var(--electric-blue);
    }
  </style>
</head>

<body>

  <main>
    <h1>Thank You from ShorePoint<span>IT</span></h1>
    <p>Your message has been successfully submitted. A ShorePointIT specialist will review it and get back to you shortly.</p>

    <div class="box">
      <h2>Need immediate assistance?</h2>
      <div class="phone">855‑574‑6737</div>
      <a href="tel:8555746737" class="call-btn">Call Now</a>
    </div>
  </main>

  <footer>
    &copy; <span id="year"></span> ShorePoint<span>IT</span>. All rights reserved.
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</body>
</html>
